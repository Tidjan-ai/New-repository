<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PraxisAssist – Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            max-width: 500px;
            width: 90%;
            padding: 50px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .button {
            margin-top: 25px;
            padding: 16px 30px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .button:hover {
            background: #0f5fd1;
        }

        .small {
            font-size: 13px;
            margin-top: 20px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🦷 PraxisAssist</h1>

        <p>
            Testen Sie unseren digitalen Telefonassistenten
            für Zahnarztpraxen.
        </p>

        <p>
            Klicken Sie auf den Button und führen Sie direkt
            ein kurzes Gespräch mit dem Assistenten.
        </p>

        <button class="button">
            🎙️ Demo starten
        </button>

        <p class="small">
            Mikrofonzugriff wird für das Gespräch benötigt.
        </p>

    </div>
<script>
    var vapiInstance = null;

    const assistant = "a13556b6-01da-48aa-88e4-f41b7966154e";
    const apiKey = "4b69b904-b71b-40c9-ac44-dea7b303cbe8";

    const buttonConfig = {
        position: "bottom-right",
        width: "60px",
        height: "60px"
    };

    (function (d, t) {
        var g = document.createElement(t),
            s = d.getElementsByTagName(t)[0];

        g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
        g.defer = true;
        g.async = true;

        s.parentNode.insertBefore(g, s);

        g.onload = function () {
            vapiInstance = window.vapiSDK.run({
                apiKey: apiKey,
                assistant: assistant,
                config: buttonConfig
            });
        };
    })(document, "script");
</script>
</body>
</html>
